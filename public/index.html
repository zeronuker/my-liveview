<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live View</title>
    <script>
      // the saved theme, before the first paint
      try {
        document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('lv.theme')) || 'midnight'
      } catch {}
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="top">
      <span class="state"><span id="dot" class="dot" data-state="idle"></span><b id="st">idle</b></span>
      <span id="s-files">0 files</span>
      <span><span id="s-add" class="pos">+0</span> <span id="s-del" class="neg">&minus;0</span></span>
      <span id="s-time" class="dim">0:00</span>
      <span id="s-chat" class="dim">All chats</span>
      <span id="conn" class="dim"></span>
    </header>
    <div id="toolbar" role="toolbar" aria-label="View controls">
      <button id="b-pause" type="button" aria-pressed="false">Pause</button>
      <button id="b-skip" type="button" disabled>Skip</button>
      <button id="b-follow" type="button" aria-pressed="true">Follow</button>
      <label class="speed">Speed
        <input id="speed" type="range" min="1" max="4" step="1" value="2" />
        <output id="speed-out" for="speed">normal</output>
      </label>
      <span class="group">
        <button id="b-smaller" type="button" aria-label="Smaller text">A&minus;</button>
        <button id="b-larger" type="button" aria-label="Larger text">A+</button>
      </span>
      <button id="b-wrap" type="button" aria-pressed="false">Wrap</button>
      <button id="b-whole" type="button" aria-pressed="true">Whole file</button>
      <button id="b-side" type="button" aria-pressed="false">Side by side</button>
      <button id="b-focus" type="button" aria-pressed="false">Focus</button>
      <button id="b-office" type="button" aria-pressed="false" title="Watch the session as an office">Office</button>
      <button id="b-record" type="button" aria-pressed="false" title="Record the Office to an mp4 file">Record</button>
      <button id="b-fit" type="button" title="Show the whole office again (or double-click it). Wheel zooms, drag pans." disabled>Fit</button>
      <button id="b-awake" type="button" aria-pressed="false" title="Keep the screen on while this window is visible">Stay awake</button>
      <select id="win-size" aria-label="Window size">
        <option value="" selected>Window size</option>
        <option value="small">Small 1000 &times; 700</option>
        <option value="medium">Medium 1200 &times; 800</option>
        <option value="large">Large 1600 &times; 1000</option>
        <option value="half">Half screen, full height</option>
      </select>
      <span class="swatches" role="group" aria-label="Theme">
        <button class="swatch" type="button" data-theme="dark" aria-label="Dark theme" title="Dark"></button>
        <button class="swatch" type="button" data-theme="light" aria-label="Light theme" title="Light"></button>
        <button class="swatch" type="button" data-theme="midnight" aria-label="Midnight theme" title="Midnight"></button>
        <button class="swatch" type="button" data-theme="terminal" aria-label="Terminal theme" title="Terminal"></button>
        <button class="swatch" type="button" data-theme="contrast" aria-label="High contrast theme" title="High contrast"></button>
      </span>
    </div>
    <div class="layout">
      <nav id="files" aria-label="Chats and the files each touched">
        <h2>Chats</h2>
        <ul id="chat-list"></ul>
      </nav>
      <div class="resizer" id="rz-nav"></div>
      <section id="panes" aria-label="Files being written">
        <div class="resizer split" id="rz-split"></div>
      </section>
      <section id="office" aria-label="The session as an office">
        <canvas id="office-canvas"></canvas>
      </section>
      <div class="resizer" id="rz-aside"></div>
      <aside id="feed" aria-label="Activity">
        <h2>Activity</h2>
        <ul id="feed-list"></ul>
      </aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
